<!DOCTYPE html>
<html>
    <head>
        <title>Websocket Assignment</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="app">
            <h1>Chess</h1>
            <div v-for="(row, rowIndex) in boardState">
                <div v-for="(col, colIndex) in row" class="tile">
                    <button class="tile" v-on:click="move(rowIndex, colIndex)">{{col}}</button>
                </div>
            </div>
        </div>
    </body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js"></script>
</html>
